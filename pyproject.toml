[project]
name = "radar-github"
version = "0.1.0"
description = "全自动 GitHub 热门项目雷达：每日采集星数，每周产出分语言/分主题增量榜单"
requires-python = ">=3.12"
# 主栈以《架构决策记录》§1 为准；此处仅声明，不打包（app 为源码目录直接运行）
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "openai>=3.3,<4",  # AI 调用客户端（OpenAI 兼容协议）；下界钉到实测验证过的 3.3，防大版本行为漂移
    "apscheduler>=3.10,<4",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# app 不打包安装，靠根目录上 sys.path 供测试导入
pythonpath = ["."]
