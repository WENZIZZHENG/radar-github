<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>GitHub 雷达 · {% block title %}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/radar.css">
</head>
<body id="top">
<header class="top">
  <div class="wrap">
    <h1 class="logo">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" opacity=".45"/>
        <circle cx="12" cy="12" r="5" opacity=".7"/>
        <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
        <path d="M12 12 19 5"/>
        <circle cx="16.6" cy="14.6" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
      GitHub 雷达
    </h1>
    <nav class="tabs" aria-label="主导航">
      <a href="/"{% if page == "week" %} class="active" aria-current="page"{% endif %}>本周报告</a>
      <a href="/quarter"{% if page == "quarter" %} class="active" aria-current="page"{% endif %}>季度回顾</a>
      <a href="/total"{% if page == "total" %} class="active" aria-current="page"{% endif %}>总星榜</a>
      {# 标签页归 T-010：禁用必须给原因（流程说明 §0），原因放 title tooltip #}
      <span class="off" title="标签功能开发中（T-010 上线）">标签</span>
    </nav>
    {% block switcher %}{% endblock %}
  </div>
</header>

<div class="wrap">
  {% block content %}{% endblock %}
  <footer class="note">
    新入池项目首周不参与增量榜 · 推荐理由由 AI 每周生成（失败时该行无推荐语块） · 榜单本地 SQL 实时计算（不物化） · 数据：GitHub 官方 API 每日 UTC 快照
  </footer>
</div>

<script src="/static/radar.js"></script>
</body>
</html>
