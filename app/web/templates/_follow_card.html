{# 我的关注单卡：boards.html 关注区列表与 T-009 关注 API 响应（前端局部插入）共用同一模板，改卡面只改这里 #}
<div class="fcard{% if f.dead %} dead{% endif %}" data-repo="{{ f.full_name }}">
  <span class="f-repo">{{ f.full_name }}{% if f.dead %}<span class="dead-tag">已失效</span>{% endif %}</span>
  <span class="f-stats">
    {%- if f.dead -%}
    <span class="f-delta na">——</span><span class="f-note">已停止采集</span>
    {%- elif f.delta_text -%}
    <span class="f-delta">{{ f.delta_text }}</span><span class="f-note">本周</span>
    {%- else -%}
    <span class="f-delta na">——</span><span class="f-note">下周起有数据</span>
    {%- endif -%}
    <span class="f-total"><svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z"/></svg>{{ f.stars_text or "——" }}</span>
  </span>
</div>
